name: Build package

on:
  pull_request:
    paths:
      - PKGBUILD
      - .gitattributes
      - .github/workflows/build.yml
  push:
    branches: [main]
    paths:
      - PKGBUILD
      - .gitattributes
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc

      - name: Normalize line endings
        run: dos2unix PKGBUILD

      - name: Build package
        run: makepkg -sf --noconfirm

      - name: Install package
        run: pacman -U --noconfirm mingw-w64-x86_64-dart-0*.pkg.tar.zst

      - name: Smoke test
        run: |
          which dart
          dart --version

      - name: Prepare release files
        id: ver
        run: |
          echo "pkgver=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          cp mingw-w64-x86_64-dart-0*.pkg.tar.zst mingw-w64-x86_64-dart-latest.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: mingw-w64-x86_64-dart-latest.pkg.tar.zst

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.pkgver }}
          name: ${{ steps.ver.outputs.pkgver }}
          generate_release_notes: true
          files: |
            mingw-w64-x86_64-dart-0*.pkg.tar.zst
            mingw-w64-x86_64-dart-latest.pkg.tar.zst
