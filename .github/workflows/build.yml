name: Build package

on:
  pull_request:
    paths:
      - PKGBUILD
      - launcher.c
      - LICENSE
      - .gitattributes
      - .github/workflows/build.yml
  push:
    branches: [main]
    paths:
      - PKGBUILD
      - launcher.c
      - LICENSE
      - .gitattributes
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc

      - name: Normalize line endings
        run: dos2unix PKGBUILD launcher.c

      - name: Build package
        run: makepkg -sf --noconfirm

      - name: Install package
        run: pacman -U --noconfirm mingw-w64-x86_64-dart-[0-9]*.pkg.tar.zst

      - name: Smoke test
        run: |
          which dart
          dart --version
          echo 'void main(List<String> a) { print("ok ${a.join(",")}"); }' > hello.dart
          dart run hello.dart one two | grep -x 'ok one,two'

      - name: Prepare release files
        id: ver
        run: |
          echo "dart=$(grep -m1 '^_dart_version=' PKGBUILD | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "rel=$(grep -m1 '^pkgrel=' PKGBUILD | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          cp mingw-w64-x86_64-dart-[0-9]*.pkg.tar.zst mingw-w64-x86_64-dart-latest.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: mingw-w64-x86_64-dart-latest.pkg.tar.zst

      - name: Write release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory '*'
          dart="${{ steps.ver.outputs.dart }}"
          rel="${{ steps.ver.outputs.rel }}"
          pkg=$(ls mingw-w64-x86_64-dart-[0-9]*.pkg.tar.zst)
          pkg_sha=$(sha256sum "$pkg" | cut -d' ' -f1)
          sdk_sha=$(grep -m1 -oE "'[0-9a-f]{64}'" PKGBUILD | tr -d "'")
          date=$(curl -fsSL "https://storage.googleapis.com/dart-archive/channels/stable/release/$dart/VERSION" \
                 | sed -n 's/.*"date": *"\([^"]*\)".*/\1/p' || true)
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changes=$(git log --pretty='- %s (%h)' "$prev"..HEAD)
          else
            changes=$(git log --pretty='- %s (%h)')
          fi

          cat > release-notes.md <<EOF
          ## Dart $dart (package release $rel)

          | | |
          |---|---|
          | Dart SDK | $dart (stable channel) |
          | Dart release date | ${date:-unknown} |
          | Package | \`$pkg\` |
          | Platform | MSYS2 MINGW64 |

          ### What changed
          $changes

          ### Checksums (SHA-256)
          - Dart SDK archive: \`$sdk_sha\`
          - Package: \`$pkg_sha\`

          ### Install
          \`\`\`bash
          pacman -U https://github.com/${{ github.repository }}/releases/download/$dart-$rel/mingw-w64-x86_64-dart-latest.pkg.tar.zst
          \`\`\`

          Source: https://storage.googleapis.com/dart-archive/channels/stable/release/$dart/sdk/dartsdk-windows-x64-release.zip
          EOF

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.dart }}-${{ steps.ver.outputs.rel }}
          name: Dart ${{ steps.ver.outputs.dart }}
          body_path: release-notes.md
          files: |
            mingw-w64-x86_64-dart-[0-9]*.pkg.tar.zst
            mingw-w64-x86_64-dart-latest.pkg.tar.zst
