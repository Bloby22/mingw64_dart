
name: Update Dart

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Perl
        run: perl -v

      - name: Debug updater and PKGBUILD
        run: |
          echo "==> Latest commit"
          git log -1 --oneline

          echo "==> Current version definitions"
          grep -n -E '^(_dart_version|pkgver|pkgrel)=' PKGBUILD

          echo "==> Check updater syntax"
          perl -c scripts/auto.pl

      - name: Run auto.pl
        run: perl scripts/auto.pl

      - name: Read new version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          dart_version="$(sed -n 's/^_dart_version=\([0-9.]*\)[[:space:]]*$/\1/p' PKGBUILD | head -n 1)"

          if [[ -z "$dart_version" ]]; then
            echo "::error::Could not read _dart_version from PKGBUILD"
            exit 1
          fi

          echo "dart=$dart_version" >> "$GITHUB_OUTPUT"
          echo "Dart version: $dart_version"

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- PKGBUILD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PKGBUILD is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PKGBUILD has been updated."
            git diff -- PKGBUILD
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "Update to Dart ${{ steps.ver.outputs.dart }}"
          branch: auto/update-sdks
          delete-branch: true
          title: "Update to Dart ${{ steps.ver.outputs.dart }}"
          body: |
            Automated update by `scripts/auto.pl`.

            - Dart: `${{ steps.ver.outputs.dart }}`

            The SDK checksum is retrieved from the official Dart archive.
          add-paths: |
            PKGBUILD
